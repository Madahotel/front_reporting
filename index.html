<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Logo_mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forma-Fusion</title>
  </head>
  <body>
    <div id="root"></div>
     <script>
      !function(window){
        const host="https://labs.heygen.com";
        const url=host+"/guest/streaming-embed?share=eyJxdWFsaXR5IjoiaGlnaCIsImF2YXRhck5hbWUiOiJBbWluYV9DaGFpcl9TaXR0aW5nX3B1YmxpYyIsInByZXZpZXdJbWciOiJodHRwczovL2ZpbGVzMi5oZXlnZW4uYWkvYXZhdGFyL3YzLzU5Y2RlNTcxZjU2ZDQ5NTJiYWM5NTY0ZGE3ZDNjY2MzXzU1MjYwL3ByZXZpZXdfdGFyZ2V0LndlYnAiLCJuZWVkUmVtb3ZlQmFja2dyb3VuZCI6ZmFsc2UsImtub3dsZWRnZUJhc2VJZCI6ImY3OGZjMTE1ODAxMDRlZjY4MjVhZWRkNzNjZTY3ZTRkIiwidXNlcm5hbWUiOiIzYzlhYTU0YTBjN2I0MTNjYTIxYjJjZDNlODFiNzZjNSJ9&inIFrame=1";
        const clientWidth=document.body.clientWidth;
        const wrapDiv=document.createElement("div");
        wrapDiv.id="heygen-streaming-embed";

        const container=document.createElement("div");
        container.id="heygen-streaming-container";

        const stylesheet=document.createElement("style");
        stylesheet.innerHTML=`
          #heygen-streaming-embed {
            z-index: 9999;
            position: fixed;
            right: 40px;
            bottom: 40px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0px 8px 24px 0px rgba(0, 0, 0, 0.12);
            transition: all linear 0.1s;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
          }
          #heygen-streaming-embed.show {
            opacity: 1;
            visibility: visible;
          }
          #heygen-streaming-embed.expand {
            ${clientWidth < 540
              ? "height: 266px; width: 96%; left: 50%; transform: translateX(-50%);"
              : "height: 366px; width: calc(366px * 16 / 9);"}
            border: 0;
            border-radius: 8px;
          }
          #heygen-streaming-container {
            width: 100%;
            height: 100%;
          }
          #heygen-streaming-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
          }
        `;

        const iframe=document.createElement("iframe");
        iframe.allowFullscreen=!1;
        iframe.title="Streaming Embed";
        iframe.role="dialog";
        iframe.allow="microphone";
        iframe.src=url;

        let visible=!1, initial=!1;

        window.addEventListener("message", (e)=>{
          if(e.origin === host && e.data?.type === "streaming-embed") {
            if(e.data.action === "init") {
              initial = true;
              wrapDiv.classList.toggle("show", initial);
            } else if(e.data.action === "show") {
              visible = true;
              wrapDiv.classList.toggle("expand", visible);
            } else if(e.data.action === "hide") {
              visible = false;
              wrapDiv.classList.toggle("expand", visible);
            }
          }
        });

        container.appendChild(iframe);
        wrapDiv.appendChild(stylesheet);
        wrapDiv.appendChild(container);
        document.body.appendChild(wrapDiv);
      }(globalThis);
    </script>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
